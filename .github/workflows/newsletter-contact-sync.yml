name: Newsletter contact sync

# Retries Resend Contact syncs that failed or never ran, and re-syncs
# subscribers suppressed after their last sync (lib/newsletter/contact-sync.ts
# ::retryPendingContactSyncs). Second line of defence before the Broadcast
# preflight; see lib/newsletter/broadcast-preflight.ts.
#
# Every 10 minutes, offset 3 minutes from send-due (newsletter-cron.yml runs
# at */5) so the two don't start together. The route stands down on its own
# while a campaign is SENDING.

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: newsletter-contact-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call sync-contacts endpoint
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://moz9.kr/api/cron/newsletter/sync-contacts)
          cat response.txt
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
